name: 构建两个版本 T3 SDK

# 触发方式:
# 1. 手动: Actions 页面 -> Run workflow
# 2. 推送 tag: git tag v3.0.0 && git push origin v3.0.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-both-versions:
    name: 构建两个版本
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      # ============ 版本A: C SDK (上次版本) ============
      - name: 版本A - 构建 Android .so (4架构)
        run: |
          export ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}
          cd "${GITHUB_WORKSPACE}/versions/c-sdk/android"
          rm -rf libs obj
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk
          tar czf "${GITHUB_WORKSPACE}/versions/c-sdk/t3sdk-c-sdk-android.tar.gz" libs

      - name: 版本A - 校验 Android .so 包含修复代码
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/check_so.py" \
            "${GITHUB_WORKSPACE}/versions/c-sdk/android/libs"

      - name: 版本A - 构建 Linux .so
        run: |
          cd "${GITHUB_WORKSPACE}/versions/c-sdk"
          gcc -shared -fPIC -O2 -o t3sdk-linux-x86_64.so \
            src/t3sdk.c -I include

      # ============ 版本B: 官方 C++ SDK (本次版本) ============
      - name: 版本B - 构建 Android .so (4架构)
        run: |
          export ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}
          cd "${GITHUB_WORKSPACE}/versions/official-cpp/android"
          rm -rf libs obj
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk
          tar czf "${GITHUB_WORKSPACE}/versions/official-cpp/t3sdk-official-cpp-android.tar.gz" libs

      - name: 版本B - 校验 Android .so 包含修复代码
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/check_so.py" \
            "${GITHUB_WORKSPACE}/versions/official-cpp/android/libs"

      - name: 版本B - 构建 Linux .so
        run: |
          set -x
          cd "${GITHUB_WORKSPACE}/versions/official-cpp/android/jni"
          g++ -std=c++17 -shared -fPIC -O2 -o "${GITHUB_WORKSPACE}/versions/official-cpp/t3sdk-official-cpp-linux-x86_64.so" \
            t3sdk/t3sdk.cpp -I .
          echo "GXX_EXIT=$?"
          ls -la "${GITHUB_WORKSPACE}/versions/official-cpp/"
          find "${GITHUB_WORKSPACE}/versions/official-cpp" -name "*.so" -ls

      # ============ App: iOS 风格 Android App ============
      - name: App - 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: App - 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: App - 安装 Android SDK 组件
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: App - 同步 libt3sdk.so 到 jniLibs
        run: |
          rm -rf "${GITHUB_WORKSPACE}/app/app/src/main/jniLibs"
          mkdir -p "${GITHUB_WORKSPACE}/app/app/src/main/jniLibs"
          cp -r "${GITHUB_WORKSPACE}/versions/official-cpp/android/libs/." \
                "${GITHUB_WORKSPACE}/app/app/src/main/jniLibs/"
          find "${GITHUB_WORKSPACE}/app/app/src/main/jniLibs" -name "*.so" -ls

      - name: App - 准备签名
        run: |
          if [ -n "${{ secrets.MYAPP_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.MYAPP_KEYSTORE_B64 }}" | base64 -d > "${GITHUB_WORKSPACE}/app/myapp.keystore"
            echo "MYAPP_KEYSTORE_FILE=${GITHUB_WORKSPACE}/app/myapp.keystore" >> "$GITHUB_ENV"
            echo "MYAPP_KEYSTORE_PASS=${{ secrets.MYAPP_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
            echo "使用仓库 secret 签名"
          else
            keytool -genkeypair -v -keystore "${GITHUB_WORKSPACE}/app/myapp.keystore" \
              -alias myapp -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass t3sdk2026 -keypass t3sdk2026 \
              -dname "CN=MyApp, OU=Dev, O=MyApp, L=Beijing, S=Beijing, C=CN" > /dev/null 2>&1
            echo "使用临时 keystore 签名"
          fi

      - name: App - 构建 release APK
        run: |
          cd "${GITHUB_WORKSPACE}/app"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk \
             "${GITHUB_WORKSPACE}/app/My_App_T3SDK_v1.0.apk"
          ls -lh "${GITHUB_WORKSPACE}/app/My_App_T3SDK_v1.0.apk"

      - name: 校验构建产物
        run: |
          echo "=== 构建产物清单 ==="
          ls -lh versions/c-sdk/t3sdk-c-sdk-android.tar.gz
          ls -lh versions/c-sdk/t3sdk-linux-x86_64.so
          ls -lh versions/official-cpp/t3sdk-official-cpp-android.tar.gz
          ls -lh versions/official-cpp/t3sdk-official-cpp-linux-x86_64.so

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: t3sdk-both-versions
          path: |
            versions/c-sdk/t3sdk-c-sdk-android.tar.gz
            versions/c-sdk/t3sdk-linux-x86_64.so
            versions/official-cpp/t3sdk-official-cpp-android.tar.gz
            versions/official-cpp/t3sdk-official-cpp-linux-x86_64.so
            app/My_App_T3SDK_v1.0.apk

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "T3 验证 SDK ${GITHUB_REF_NAME}" \
            --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" \
            versions/c-sdk/t3sdk-c-sdk-android.tar.gz \
            versions/c-sdk/t3sdk-linux-x86_64.so \
            versions/official-cpp/t3sdk-official-cpp-android.tar.gz \
            versions/official-cpp/t3sdk-official-cpp-linux-x86_64.so \
            app/My_App_T3SDK_v1.0.apk \
            --clobber
