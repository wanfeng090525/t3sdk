name: 构建两个版本 T3 SDK

# 触发方式:
# 1. 手动: Actions 页面 -> Run workflow
# 2. 推送 tag: git tag v3.0.0 && git push origin v3.0.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NDK_VERSION: r27

jobs:
  # ============ 版本A: C SDK (上次版本) ============
  build-c-sdk:
    name: 版本A - C SDK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Android NDK
        uses: android-actions/setup-android@v3

      - name: 构建 Android .so (4架构)
        run: |
          cd versions/c-sdk/android
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk
          tar czf ../t3sdk-c-sdk-android.tar.gz libs

      - name: 构建 Linux .so (核心库)
        run: |
          cd versions/c-sdk
          gcc -shared -fPIC -O2 -o t3sdk-linux-x86_64.so \
            src/t3sdk.c -I include

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: t3sdk-c-sdk
          path: |
            versions/c-sdk/t3sdk-c-sdk-android.tar.gz
            versions/c-sdk/t3sdk-linux-x86_64.so

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "T3 验证 SDK ${GITHUB_REF_NAME}" \
            --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" \
            versions/c-sdk/t3sdk-c-sdk-android.tar.gz \
            versions/c-sdk/t3sdk-linux-x86_64.so \
            --clobber

  # ============ 版本B: 官方 C++ SDK (本次版本) ============
  build-official-cpp:
    name: 版本B - 官方 C++ SDK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Android NDK
        uses: android-actions/setup-android@v3

      - name: 构建 Android .so (4架构)
        run: |
          cd versions/official-cpp/android
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk
          tar czf ../t3sdk-official-cpp-android.tar.gz libs

      - name: 构建 Linux .so (核心库)
        run: |
          cd versions/official-cpp/android/jni
          g++ -std=c++17 -shared -fPIC -O2 -o ../../../t3sdk-official-cpp-linux-x86_64.so \
            t3sdk/t3sdk.cpp -I .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: t3sdk-official-cpp
          path: |
            versions/official-cpp/t3sdk-official-cpp-android.tar.gz
            versions/official-cpp/t3sdk-official-cpp-linux-x86_64.so

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "T3 验证 SDK ${GITHUB_REF_NAME}" \
            --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" \
            versions/official-cpp/t3sdk-official-cpp-android.tar.gz \
            versions/official-cpp/t3sdk-official-cpp-linux-x86_64.so \
            --clobber
